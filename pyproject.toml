[project]
name = "ytx-workspace"
version = "0.1.0"
description = "YouTube transcript extractor: CLI + API over a resilient multi-backend cascade"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
src = ["packages/*/src", "packages/*/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"packages/ytx_cli/src/ytx_cli/main.py" = ["B006"]

[tool.pytest.ini_options]
testpaths = ["packages"]
