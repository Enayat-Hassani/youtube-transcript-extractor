[project]
name = "ytx-api"
version = "0.1.0"
description = "FastAPI service exposing ytx-core transcript extraction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "ytx-core",
]

[tool.uv.sources]
ytx-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytx_api"]
