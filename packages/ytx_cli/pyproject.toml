[project]
name = "ytx-cli"
version = "0.1.0"
description = "Command-line interface for ytx-core (ytx command)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "ytx-core",
]

[project.scripts]
ytx = "ytx_cli.main:app"

[tool.uv.sources]
ytx-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytx_cli"]
