[project]
name = "ytx-core"
version = "0.1.0"
description = "YouTube transcript extraction: multi-backend cascade, cache, canonical model, exporters"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "youtube-transcript-api>=1.2,<2",
    "yt-dlp>=2025.6.9",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytx_core"]
