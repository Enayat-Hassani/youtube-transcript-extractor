name = "tech"
description = "Software engineering, infrastructure and web development."
detect = [
  "code", "coding", "developer", "programming", "software", "api",
  "database", "kubernetes", "docker", "javascript", "python", "typescript",
  "framework", "backend", "frontend", "deploy", "repository", "compiler",
  "server", "devops", "open source",
]

rules = [
  # languages and runtimes
  ['\bjava\s+script\b',   "JavaScript"],
  ['\bjavascript\b',      "JavaScript"],
  ['\btype\s+script\b',   "TypeScript"],
  ['\btypescript\b',      "TypeScript"],
  ['\bnode\s+js\b',       "Node.js"],
  ['\bnodejs\b',          "Node.js"],
  ['\bpy\s?thon\b',       "Python"],
  ['\bc\s+sharp\b',       "C#"],
  ['\bc\s+plus\s+plus\b', "C++"],
  # data stores
  ['\bpostgres\s?ql\b',   "PostgreSQL"],
  ['\bpostgres\b',        "Postgres"],
  ['\bmy\s?sql\b',        "MySQL"],
  ['\bmongo\s?db\b',      "MongoDB"],
  ['\bsqlite\b',          "SQLite"],
  ['\bredis\b',           "Redis"],
  # infra and tooling
  ['\bkubernetes\b',      "Kubernetes"],
  ['\bkubectl\b',         "kubectl"],
  ['\bdocker\b',          "Docker"],
  ['\bterraform\b',       "Terraform"],
  ['\bengine\s+x\b',      "nginx"],
  ['\bnginx\b',           "nginx"],
  ['\bgit\s+hub\b',       "GitHub"],
  ['\bgithub\b',          "GitHub"],
  ['\bgit\s+lab\b',       "GitLab"],
  ['\bvs\s+code\b',       "VS Code"],
  ['\bvscode\b',          "VS Code"],
  ['\blinux\b',           "Linux"],
  ['\bubuntu\b',          "Ubuntu"],
  ['\bdev\s+ops\b',       "DevOps"],
  ['\bci\s*/?\s*cd\b',    "CI/CD"],
  # protocols, formats, acronyms
  ['\bgraph\s?ql\b',      "GraphQL"],
  ['\bo\s?auth\b',        "OAuth"],
  ['\brest\s+api\b',      "REST API"],
  ['\bjson\b',            "JSON"],
  ['\byaml\b',            "YAML"],
  ['\bhtml\b',            "HTML"],
  ['\bcss\b',             "CSS"],
  ['\bsql\b',             "SQL"],
  ['\bapi\b',             "API"],
  ['\bapis\b',            "APIs"],
  ['\bsdk\b',             "SDK"],
  ['\bcli\b',             "CLI"],
  ['\bllm\b',             "LLM"],
  ['\bllms\b',            "LLMs"],
  ['\bcpu\b',             "CPU"],
  ['\bgpu\b',             "GPU"],
  ['\bssd\b',             "SSD"],
  ['\bui\b',              "UI"],
  ['\bux\b',              "UX"],
]
